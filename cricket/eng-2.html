
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,
 maximum-scale=1,user-scalable=no,
 viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<title>Fullscreen Player</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #000;
}

#frame {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  border: none;
  outline: none;
  display: block;
  background: #000;
}
</style>
</head>
<body>

<iframe
  id="frame"
  allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
  allowfullscreen
  referrerpolicy="no-referrer">
</iframe>

<script>
(function () {
  "use strict";

  // Replace with your iframe URL
  const URL = "https://allrounder3-0.pages.dev/sports/player?id=ten-2";

  // Base64 encode
  const encrypted = btoa(
    unescape(encodeURIComponent(URL))
  );

  // Decode and load
  const decoded = decodeURIComponent(
    escape(atob(encrypted))
  );

  document.getElementById("frame").src = decoded;
})();
</script>

</body>
</html>
