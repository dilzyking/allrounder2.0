    .sound-btn.pulse {

  /* ================= PLAYER ================= */
  const video = document.getElementById("video");
  const loading = document.getElementById("loading");
  const soundBtn = document.getElementById("soundBtn");

  // Force full volume and unmute
  function forceFullVolume() {
    if (!video) return;
    video.muted = false;
    video.volume = 1.0;
    if (video.paused) {
      video.play().catch(e => console.log("play after unmute:", e));
    }
    soundBtn.classList.add("hidden");
    soundBtn.classList.remove("pulse");
  }

  // Click handler for "Click for sound"
  if (soundBtn) {
    soundBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      forceFullVolume();
    });
  }

  // Show / hide button based on mute state
  function syncSoundButton() {
    if (!video) return;
    if (video.muted || video.volume < 0.01) {
      soundBtn.classList.remove("hidden");
      soundBtn.classList.add("pulse");
    } else {
      soundBtn.classList.add("hidden");
      soundBtn.classList.remove("pulse");
    }
  }

  // Listen to volume changes
  video.addEventListener("volumechange", syncSoundButton);
  video.addEventListener("playing", () => {
    loading.style.display = "none";
    syncSoundButton();
  });

  // Initial state
  syncSoundButton();

  /* ================= INIT PLAYER (SHAKA 4.16.3) ================= */
  async function initPlayer() {
    if (!streamUrl) {
      alert("Stream URL missing");
      return;
    }

    try {
      const player = new shaka.Player(video);
      const container = document.querySelector(".shaka-video-container");
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: [
          'play_pause',
          'mute',
          'time_and_duration',
          'spacer',
          'quality',
          'language',
          'picture_in_picture',
          'fullscreen',
          'overflow_menu'
        ],
        addSeekBar: true
      });

      player.configure({
        streaming: {
          bufferingGoal: 10,
          rebufferingGoal: 2,
          bufferBehind: 30
        }
      });

      await player.load(streamUrl);

      video.play().catch(() => {
        video.muted = true;
        video.play();
      });

      video.addEventListener("playing", () => {
        loading.style.display = "none";
        syncSoundButton();
      });

    } catch (e) {
      console.log("Shaka error:", e);
      // Fallback to native HLS
      video.src = streamUrl;
      video.play().catch(() => {
        video.muted = true;
        video.play();
      });

      video.addEventListener("playing", () => {
        loading.style.display = "none";
        syncSoundButton();
      });
    }
  }

  document.addEventListener("DOMContentLoaded", initPlayer);
</script>
