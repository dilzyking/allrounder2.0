    /* --- Center play/pause button --- */
    .center-toggle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(229, 9, 20, 0.85);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.15s ease;
      z-index: 20;
    }
    .center-toggle.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .center-toggle:active {
      transform: translate(-50%, -50%) scale(0.92);
    }
    .center-toggle svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }

    /* --- Frozen frame, shown instead of a black flash while buffering --- */
    #freezeFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      z-index: 5;
      pointer-events: none;
    }
  </style>

        player.on('seeking', showFreeze);

        function showCenter() {

          clearTimeout(hideTimer);

        player.on('pause', () => {

          setupPlayer(null);
