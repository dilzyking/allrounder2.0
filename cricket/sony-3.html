  <script>

      const pth = document.getElementById('pth');
      const bplay = document.getElementById('bplay');
      const pico = document.getElementById('pico');
      const bvol = document.getElementById('bvol');
      const vico = document.getElementById('vico');
      const livepill = document.getElementById('livepill');

      let shakaPlayer = null, hlsInst = null;

      function cancelAutoResume() { clearTimeout(autoResumeTimer); autoResumeTimer = null; }

      function doPlay(reason) {
        if (vid.ended) return;
        if (reason === 'auto' && currentIntent === 'pause') return;
        if (!vid.paused) return;
        const mySeq = ++playSeq;
        let p;
        try { p = vid.play(); } catch (e) { return; }
        if (p && typeof p.then === 'function') p.then(() => { if (mySeq === playSeq) currentIntent = 'play'; }).catch(() => {});
      }
      function doPause() { ++playSeq; currentIntent = 'pause'; cancelAutoResume(); try { vid.pause(); } catch (e) {} }

      const FILL_MODES = [

        hasError = true;

        pOverlay.style.opacity = '0';
        clearTimeout(overlayHideTimer);

        document.getElementById('etitle').textContent = title || 'Stream Unavailable';
        document.getElementById('emsg').textContent = msg || '';
        errOv.classList.add('show');
      }
      function toFriendlyMessage(raw) {
        raw = String(raw || '');
        if (/timeout/i.test(raw)) return 'Connection timed out. Please check your internet and try again.';
        if (/network error/i.test(raw)) return 'Network problem — please check your internet connection.';
        if (/http\s*4\d\d/i.test(raw)) return 'This stream is currently unavailable.';
        if (/http\s*5\d\d/i.test(raw)) return 'Server is temporarily unavailable. Please try again shortly.';
        if (/shaka error|unsupported|not supported/i.test(raw)) return 'This stream could not be played on your browser right now.';
        return raw;
      }

      vid.addEventListener('waiting', () => bufspin.style.display = 'block');
      vid.addEventListener('playing', () => { bufspin.style.display = 'none'; if (currentIntent !== 'pause') currentIntent = 'play'; });
      vid.addEventListener('canplay', () => bufspin.style.display = 'none');
      vid.addEventListener('play', () => { syncBig(); syncPlayIcon(); showCtrls(); });
      vid.addEventListener('pause', () => {
        syncBig(); syncPlayIcon(); showCtrls();
        if (vid.ended || currentIntent === 'pause') return;
        cancelAutoResume();
        autoResumeTimer = setTimeout(() => { if (vid.paused && !vid.ended && currentIntent !== 'pause') doPlay('auto'); }, 600);
        setTimeout(tryResume, 2000);
      });
      vid.addEventListener('volumechange', () => { if (!vid.muted && vid.volume > 0) userUnmuted = true; });
      vid.addEventListener('timeupdate', () => {
        if (isDragging) return;

      vid.addEventListener('progress', () => {
        if (!vid.buffered.length || !isFinite(vid.duration)) return;
        pbuf.style.width = (vid.buffered.end(vid.buffered.length - 1) / vid.duration * 100) + '%';

      vid.addEventListener('loadedmetadata', () => { isLive = !isFinite(vid.duration) || vid.duration > 86400; if (!isLive) livepill.style.display = 'none'; });

      function syncBig() {
        if (vid.paused && !hasError) { bigplay.classList.add('shown'); bigplay.classList.remove('gone'); }
        else { bigplay.classList.remove('shown'); bigplay.classList.add('gone'); }
      }
      function syncPlayIcon() {
        pico.innerHTML = vid.paused
          ? '<path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72L9.5 4.27A1 1 0 0 0 8 5.14z" fill="currentColor"/>'

      }
      function syncVol() {
        isMuted = vid.muted;
        bvol.classList.toggle('is-muted', isMuted);
        vico.innerHTML = isMuted
          ? '<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><line x1="16.5" y1="9.5" x2="22.5" y2="15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="9.5" x2="16.5" y2="15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
          : '<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>';
      }
      syncBig(); syncPlayIcon(); syncVol();

      bpbtn.addEventListener('click', e => { e.stopPropagation(); playerActivated = true; cancelAutoResume(); currentIntent = 'play'; doPlay('user'); });

      playerEl.addEventListener('click', e => {
        if (e.target.closest('#dock') || e.target.closest('.bpbtn') || e.target.closest('#errOv')) return;
        if (!playerActivated) { playerActivated = true; showCtrls(); return; }
        if (e.target === vid || e.target === playerEl) {
          if (ctrls.classList.contains('gone')) { showCtrls(); return; }
          togglePlay();
        }
      });

      function showCtrls() { ctrls.classList.remove('gone'); clearTimeout(hideTimer); if (!vid.paused) hideTimer = setTimeout(() => ctrls.classList.add('gone'), 3200); }
      playerEl.addEventListener('mousemove', showCtrls);
      playerEl.addEventListener('touchstart', showCtrls, { passive: true });
      showCtrls();

      function togglePlay() { if (vid.paused) { cancelAutoResume(); currentIntent = 'play'; doPlay('user'); } else doPause(); }
      bplay.addEventListener('click', e => { e.stopPropagation(); togglePlay(); });

      function tryResume() { if (vid.ended || !vid.paused || currentIntent === 'pause' || document.hidden || hasError) return; doPlay('auto'); }
      setInterval(tryResume, 3000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(tryResume, 300); });
      window.addEventListener('focus', () => setTimeout(tryResume, 300));
      document.addEventListener('fullscreenchange', () => setTimeout(tryResume, 500));
      document.addEventListener('webkitfullscreenchange', () => setTimeout(tryResume, 500));

      vid.addEventListener('leavepictureinpicture', () => setTimeout(tryResume, 500));
