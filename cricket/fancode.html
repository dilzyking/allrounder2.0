<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: #000;
  overflow: hidden;
}

#videoContainer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.shaka-video-container {
  width: 100%;
  height: 100%;
}

.shaka-spinner-container,
.shaka-spinner,
.shaka-spinner-svg {
  display: none !important;
}

#error {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font: 14px Arial, sans-serif;
  text-align: center;
  padding: 20px;
  display: none;
  z-index: 10;
  pointer-events: none;
}
</style>

<div id="videoContainer">
  <video
    id="video"
    autoplay
    playsinline
    preload="auto">
  </video>
  <div id="error"></div>
</div>

<script>
const STREAM_URL = "https://stream-sprout-proxy.lovable.app/api/proxy?u=https://in-mc-flive.fancode.com/mumbai/4250640_english_hls_531bf4661e7063_1ta-di_h264/1080p.m3u8?hdntl=Expires=1794628546~_GO=Generated~acl=/mumbai/4250640_english_hls_531bf4661e7063_1ta-di_h264/*~SessionID=330387595_fc-web_e17f533d-0cb8-4f~Signature=AbO9BjhOYLd1GmMfhOhHHklnPOfhTKBOpq8RY94K5cvEs32zsfobefwN_2FtsFC-VmxLp67-63kmnIeMKq08MmKZpgcO";

async function initPlayer() {
  const video = document.getElementById("video");
  const container = document.getElementById("videoContainer");
  const errorBox = document.getElementById("error");

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    showError("Browser not supported");
    return;
  }

  const player = new shaka.Player();
  await player.attach(video);

  const ui = new shaka.ui.Overlay(
    player,
    container,
    video
  );

  ui.configure({
    addBigPlayButton: true,
    controlPanelElements: [
      "play_pause",
      "mute",
      "volume",
      "time_and_duration",
      "spacer",
      "language",
      "captions",
      "quality",
      "picture_in_picture",
      "fullscreen"
    ],
    seekBarColors: {
      base: "#828282",
      buffered: "#ffc336",
      played: "#ff751b"
    }
  });

  player.configure({
    streaming: {
      bufferingGoal: 15,
      rebufferingGoal: 2,
      bufferBehind: 15,
      retryParameters: {
        timeout: 10000,
        maxAttempts: 5,
        baseDelay: 500,
        backoffFactor: 1.5
      }
    }
  });

  player.addEventListener("error", event => {
    console.error("Shaka Error:", event.detail);
    showError("Stream playback error");
  });

  try {
    await player.load(
      STREAM_URL,
      null,
      "application/x-mpegurl"
    );

    try {
      await video.play();
    } catch (e) {
      console.log("Autoplay blocked. Tap play.");
    }
  } catch (e) {
    console.error(e);
    showError("Unable to load stream");
  }
}

document.addEventListener(
  "DOMContentLoaded",
  initPlayer
);
</script>
