<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sony max HD</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }
    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
  </style>
</head>
<body>
  <div class="shaka-video-container" data-shaka-player>
    <video autoplay playsinline preload="metadata" poster=""></video>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        console.error('Browser not supported');
        return;
      }

      const video = document.querySelector('video');
      const player = new shaka.Player();
      await player.attach(video);

      const container = document.querySelector('.shaka-video-container');
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: [
          'play_pause', 'time_and_duration', 'mute', 'volume',
          'spacer', 'language', 'captions', 'picture_in_picture',
          'quality', 'fullscreen'
        ],
        volumeBarColors: {
  base: 'rgb(255, 215, 0)',   // Yellow
  level: 'rgb(255, 0, 0)'     // Red
},
seekBarColors: {
  base: 'rgb(255, 215, 0)',   // Yellow
  buffered: 'rgb(255, 165, 0)', // Orange
  played: 'rgb(255, 0, 0)'    // Red
}
      });

      // Default ClearKey DRM
      let drmConfig = {
        clearKeys: {
          "91fce77f2f8056f084ed961c7ebe86ed":"8214bd5eb6c21444e8ea644824affd79"
        }
      };

      // Token storage
      let cookieHeader = "";
      let tokenValue = "";

      // Primary stream URL
      let streamUrl = "https://jiotvmblive.cdn.jio.com/bpk-tv/Ten2_HD_MOB/WDVLive/index.mpd";

      // Fetch token from Hindi.json
      async function fetchTokenFromSite() {
        try {
          const res = await fetch('https://allrounder2-0.pages.dev/api/Hindi.json', { 
            cache: 'no-store', 
            mode: 'cors' 
          });
          if (!res.ok) throw new Error('Token fetch HTTP ' + res.status);
          
          const data = await res.json();
          if (data && data.cookie) {
            // Store full cookie for header
            cookieHeader = data.cookie.trim();
            
            // Extract token value for URL
            const match = cookieHeader.match(/__hdnea__=([^&]*)/);
            tokenValue = match ? match[0] : cookieHeader;
            
            console.log('Token fetched successfully');
            console.log('Cookie Header:', cookieHeader);
            console.log('Token Value:', tokenValue);
            return true;
          }
        } catch (err) {
          console.warn('Failed to fetch token:', err.message);
        }
        return false;
      }

      // Initial fetch
      await fetchTokenFromSite();

      // Refresh token every 5 minutes
      setInterval(fetchTokenFromSite, 5 * 60 * 1000);

      player.configure({
        drm: drmConfig,
        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 15,
          rebufferingGoal: 2,
          bufferBehind: 15,
          retryParameters: {
            timeout: 10000,
            maxAttempts: 5,
            baseDelay: 300,
            backoffFactor: 1.2
          },
          segmentRequestTimeout: 8000,
          segmentPrefetchLimit: 2,
          useNativeHlsOnSafari: true
        },
        manifest: {
          retryParameters: {
            timeout: 8000,
            maxAttempts: 3
          }
        }
      });

      // Register request filter with proper cookie handling
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // Set headers
        request.headers['Referer'] = 'https://www.jiotv.com/';
        request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        
        // Add cookie if available
        if (cookieHeader) {
          request.headers['Cookie'] = cookieHeader;
          
          // For manifest and segment requests, append token to URL if needed
          if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
               type === shaka.net.NetworkingEngine.RequestType.SEGMENT) && 
              request.uris[0] && !request.uris[0].includes('__hdnea=')) {
            const separator = request.uris[0].includes('?') ? '&' : '?';
            request.uris[0] += separator + tokenValue;
          }
        }
      });

      const enableAutoplay = () => {
        video.setAttribute('autoplay', '');
        video.setAttribute('playsinline', '');
        video.autoplay = true;
      };

      const attemptAutoplay = async () => {
        try {
          video.muted = false;
          await video.play();
          console.log('Unmuted autoplay successful');
          return true;
        } catch (error) {
          console.log('Unmuted autoplay failed:', error.message);
          try {
            video.muted = true;
            await video.play();
            console.log('Muted autoplay successful');
            return true;
          } catch (mutedError) {
            console.log('Muted autoplay failed:', mutedError.message);
            return false;
          }
        }
      };

      player.addEventListener('error', (event) => {
        console.error('Shaka Player Error:', event.detail);
      });

      video.addEventListener('play', () => {
        if (window.self === window.top && !document.fullscreenElement && window.innerWidth <= 768) {
          container.requestFullscreen().catch(() => {
            console.log('Fullscreen request failed');
          });
        }
      }, { once: true });

      video.addEventListener('loadedmetadata', () => {
        video.volume = 0.8;
      });

      let hasUserInteracted = false;
      const enableSoundOnInteraction = () => {
        if (!hasUserInteracted && video.muted) {
          video.muted = false;
          hasUserInteracted = true;
          console.log('Sound enabled after user interaction');
        }
      };
      ['click', 'touchstart', 'keydown'].forEach(event => {
        document.addEventListener(event, enableSoundOnInteraction, { once: true });
      });

      try {
        enableAutoplay();
        await player.load(streamUrl);
        if (video.readyState >= 3) {
          await attemptAutoplay();
        } else {
          video.addEventListener('canplay', attemptAutoplay, { once: true });
          setTimeout(async () => {
            if (video.paused) {
              await attemptAutoplay();
            }
          }, 2000);
        }
      } catch (error) {
        console.error('Load error:', error);
      }

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && video.paused) {
          attemptAutoplay();
        }
      });
    });
  </script>
  
  <!-- Enhanced Anti-Debugging -->
  <script src="https://cdn.jsdelivr.net/npm/disable-devtool@latest"></script>
  <script>
    DisableDevtool({
      disable: true,
      disableMenu: true,
      clearLog: true,
      disableSelect: true,
      disableCopy: true,
      disableCut: true,
      disablePaste: true,
      interval: 10,
      disableMobile: true,
      ondevtoolopen: function() {
        window.location.href = 'about:blank';
      }
    });
  </script>

</body>
</html>
