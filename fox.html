<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VK Player</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}
iframe{
    width:100vw;
    height:100vh;
    border:none;
}
</style>
</head>
<body>

<iframe
    src="https://usa.mdtv.dpdns.org/live-vkvideo.php"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    loading="eager"
    referrerpolicy="no-referrer">
</iframe>

</body>
</html>
