<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}
#loader{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:9999;
}
.spinner{
    width:60px;
    height:60px;
    border:6px solid rgba(255,255,255,.2);
    border-top:6px solid #fff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin{
    to{transform:rotate(360deg);}
}
iframe{
    width:100%;
    height:100%;
    border:0;
    display:none;
}
</style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
</div>

<iframe id="player"
src="https://channel-13-alpha.vercel.app/hls.html"
allow="autoplay; fullscreen; picture-in-picture"
allowfullscreen>
</iframe>

<script>
const iframe = document.getElementById("player");

setTimeout(() => {
    document.getElementById("loader").style.display = "none";
    iframe.style.display = "block";
}, 5000);
</script>

</body>
</html>
