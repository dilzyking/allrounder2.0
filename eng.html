<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Full Page Player – No Gap</title>
  <style>
    /* Reset all margins, paddings, and gaps */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;          /* prevent scrollbars from any tiny overflow */
      background-color: #000;    /* black background for seamless edges */
    }

    /* Full-page iframe container – fills entire viewport */
    .player-wrapper {
      position: fixed;           /* fix to viewport, ignores any body flow */
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /* The iframe itself – stretches to fill wrapper completely,
       no border, no margin, no padding, no gaps */
    .player-wrapper iframe {
      display: block;            /* remove inline element gap */
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      /* aspect-ratio is intentionally removed so iframe fills 
         exactly 100% height/width of wrapper (no letterboxing) */
    }
  </style>
</head>
<body>
  <div class="player-wrapper">
    <iframe
      src="https://epiembeds.online/embed/fox-sports-501#FOX-501"
      sandbox="allow-scripts allow-same-origin"
      referrerpolicy="no-referrer"
      allow="encrypted-media; fullscreen"
      allowfullscreen
      title="Full page video player"
    ></iframe>
  </div>

</html>
